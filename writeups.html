<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writeups</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #0d0d0d;
  color: #e0e0e0;
  font-family: system-ui, -apple-system, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}
nav {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  display: flex;
  justify-content: flex-end;
  gap: 2rem;
  padding: 1.5rem 2rem;
  background: #0d0d0d;
}
nav a {
  color: #7eb8e0;
  text-decoration: none;
  font-size: clamp(0.9rem, 2.5vw, 1.1rem);
  transition: color 0.2s;
}
nav a:hover { color: #b3d4f0; }
main {
  font-size: clamp(1.2rem, 4vw, 2rem);
  color: #7eb8e0;
}
</style>
</head>
<body>
<main>Coming soon...</main>
<script>fetch('nav.html').then(r=>r.text()).then(h=>{var e=document.createElement('div');e.innerHTML=h;document.body.insertBefore(e,document.body.firstChild)})</script>
</body>
</html>
